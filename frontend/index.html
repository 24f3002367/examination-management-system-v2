<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination Management Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div id="app">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Exam Management Portal</a>
            <div class="d-flex align-items-center text-white" v-if="user">
                <span class="me-3">{{ user.full_name }} ({{ user.role.toUpperCase() }})</span>
                <button class="btn btn-outline-light btn-sm" @click="logout">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div v-if="alertMessage" :class="['alert', alertType === 'error' ? 'alert-danger' : 'alert-success', 'alert-dismissible']">
            {{ alertMessage }}
            <button type="button" class="btn-close" @click="alertMessage = ''"></button>
        </div>

        <auth-component v-if="!user" @login-success="handleLoginSuccess" :api="api" :notify="notify"></auth-component>
        <admin-component v-if="user && user.role === 'admin'" :api="api" :notify="notify" :user="user"></admin-component>
        <examiner-component v-if="user && user.role === 'examiner'" :api="api" :notify="notify" :user="user"></examiner-component>
        <student-component v-if="user && user.role === 'student'" :api="api" :notify="notify" :user="user"></student-component>
    </div>
</div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
